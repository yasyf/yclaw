# GENERATED by cc-guides from .claude/fragments/.pre-commit-config.yaml/ — do not edit; edit the fragments and run 'cc-guides render'.
# Commit-time checks, composed by cc-guides from the shared cc-skills pack.
# Run by prek — a fast Rust drop-in for pre-commit: `ccx vcs ship` runs these
# hooks before every commit, and `uvx prek install` wires them into plain
# `git commit` too.
# prek-only: the `repo: builtin` hooks are prek-native (Rust, offline, no rev);
# legacy pre-commit cannot parse this file.
# Rev pins are centrally managed in the cc-skills pack fragments — a local
# `uvx prek autoupdate` shows up as drift and the daily re-render reverts it.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # Skill template trees hold moustache sources ({{#SECTION}} markers,
        # {{TOKEN}} mid-scalar) that are not YAML/JSON/TOML documents; they
        # are validated post-render. Inert in repos without such paths.
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-json
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-toml
        exclude: ^plugins/[^/]+/skills/[^/]+/templates/
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1 MiB, not the 500 KB default: gen-image compresses repo brand images
        # (banners, social cards) to just under 1 MiB.
        args: [--maxkb=1024]
      - id: detect-private-key

# Secret guard for commits. Install once (contributors only):
#   brew install pre-commit && pre-commit install
# The local pygrep hook is self-contained (no pinned external rev) and fails the commit if a
# secret-shaped string is staged — the same high-precision patterns the CI genericity guard uses
# (.github/workflows/build-images.yml). Real secrets live only in ~/.yclaw/state + the yclaw
# keychain, never the repo. To also run the full gitleaks scanner, add its hosted hook below.
  - repo: local
    hooks:
      - id: no-secret-shaped-strings
        name: block secret-shaped strings
        language: pygrep
        types: [text]
        # Exclude the files that legitimately carry the patterns themselves (this config + the CI
        # guard) and the example secrets template (EXAMPLE placeholders, never real values).
        exclude: '^(\.pre-commit-config\.yaml|\.github/workflows/build-images\.yml|secrets/secrets\.sops\.yaml\.example)$'
        entry: '(tskey-(auth|api)-[A-Za-z0-9]|sk-[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|AGE-SECRET-KEY-1|-----BEGIN [A-Z ]*PRIVATE KEY-----)'

  # Python lint + format for the yclaw CLI package. ty (the type checker) has no official
  # pre-commit hook repo that resolves offline, so type checking stays a manual `uvx ty check
  # yclaw` step (also run in CI) rather than a pre-commit hook.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
