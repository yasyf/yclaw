[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "yclaw"
version = "0.1.0"
description = "Debug CLI for the yclaw fleet (metal / hermes / bluebubbles)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8",
    "loguru>=0.7",
    "anyio>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
yclaw = "yclaw.cli:main"

[tool.uv.build-backend]
module-name = "yclaw"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"
# The yclaw package + tests are the Python project. The embedded helper scripts under darwin/ and
# scripts/ belong to the nix / shell workstreams and are not linted or formatted by the package ruff.
extend-exclude = ["darwin", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.rules]
all = "warn"
